services:
  emqx:
    image: emqx/emqx:5.8.4
    container_name: flow-emqx
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?set EMQX_DASHBOARD_PASSWORD in .env}
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_AUTHENTICATION__1: '{mechanism="password_based",backend="built_in_database",user_id_type="username",password_hash_algorithm={name="sha256",salt_position="suffix"},bootstrap_file="/opt/emqx/etc/auth-built-in-db-bootstrap.csv",bootstrap_type="plain"}'
    ports:
      - "1883:1883"
      - "127.0.0.1:18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./deploy/emqx/auth-built-in-db-bootstrap.csv:/opt/emqx/etc/auth-built-in-db-bootstrap.csv:ro

  postgres:
    image: postgres:16-alpine
    container_name: flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flow_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-flow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: flow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flow_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-flow_monitor}
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      MQTT_TOPIC: ${MQTT_TOPIC:-meters/+/reading}
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      CLOCK_SKEW_SECONDS: ${CLOCK_SKEW_SECONDS:-120}
      OFFLINE_AFTER_SECONDS: ${OFFLINE_AFTER_SECONDS:-180}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TYPE: ${ALERT_WEBHOOK_TYPE:-wechat}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      TZ: Asia/Shanghai

  frontend:
    build:
      context: ./frontend
    container_name: flow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro

volumes:
  emqx-data:
  emqx-log:
  postgres-data:
